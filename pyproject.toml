[project]
name = "jobpdf"
version = "0.1.0"
description = "CV parsing, ESCO skill normalization and vacancy ranking"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "rapidfuzz>=3.14.5",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobpdf"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ mirrors jobpdf/, so same-named test files in different folders must not clash.
addopts = "--import-mode=importlib"
